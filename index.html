<!DOCTYPE html>
<html lang="tr" class="h-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ComicGen AI</title>
    <meta name="description" content="Yapay zeka destekli, 4 panelli çizgi roman oluşturucu. Karakterleri tanımlayın, konuyu belirleyin ve hikayenizi görselleştirin." />
    <meta property="og:title" content="ComicGen AI" />
    <meta property="og:description" content="Yapay zeka destekli, 4 panelli çizgi roman oluşturucu. Karakterleri tanımlayın, konuyu belirleyin ve hikayenizi görselleştirin." />
    
    <!-- PWA Web App Manifest & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#facc15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ComicGen AI" />
    <meta name="application-name" content="ComicGen AI" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
                comic: ['"Comic Neue"', 'cursive'],
                display: ['Bangers', 'cursive'],
                mono: ['"JetBrains Mono"', 'monospace'],
              },
              boxShadow: {
                'comic-xs': '2px 2px 0px 0px rgba(0,0,0,1)',
                'comic-sm': '3px 3px 0px 0px rgba(0,0,0,1)',
                'comic': '4px 4px 0px 0px rgba(0,0,0,1)',
                'comic-lg': '8px 8px 0px 0px rgba(0,0,0,1)',
                'comic-xl': '12px 12px 0px 0px rgba(0,0,0,1)',
                'comic-2xl': '16px 16px 0px 0px rgba(0,0,0,1)',
                'comic-hover': '2px 2px 0px 0px rgba(0,0,0,1)',
                'comic-glow': '0 0 25px rgba(250, 204, 21, 0.35), 4px 4px 0px 0px rgba(0,0,0,1)',
                'comic-glow-red': '0 0 25px rgba(239, 68, 68, 0.35), 4px 4px 0px 0px rgba(0,0,0,1)',
                'comic-glow-blue': '0 0 25px rgba(59, 130, 246, 0.35), 4px 4px 0px 0px rgba(0,0,0,1)',
              },
              animation: {
                'float': 'float 3s ease-in-out infinite',
                'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              },
              keyframes: {
                float: {
                  '0%, 100%': { transform: 'translateY(0)' },
                  '50%': { transform: 'translateY(-10px)' },
                },
                shake: {
                  '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                  '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                  '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                  '40%, 60%': { transform: 'translate3d(4px, 0, 0)' },
                }
              }
            }
          }
        }
    </script>
    <style>
      :root {
        --comic-yellow: #fbbf24;
        --comic-red: #ef4444;
        --comic-blue: #3b82f6;
        --comic-black: #000000;
        --comic-dark: #0b0f19;
      }
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: #0b0f19;
        color: white;
      }
      #root {
        height: 100%;
      }
      /* Halftone Dot Matrix with Subtle Cinematic Vignette */
      .bg-halftone {
        background-color: #0b0f19;
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(250, 204, 21, 0.05) 0%, transparent 45%),
          radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.04) 0%, transparent 40%),
          radial-gradient(#1e293b 1.3px, transparent 1.3px);
        background-size: 100% 100%, 100% 100%, 20px 20px;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--comic-yellow); 
        border: 2px solid #0f172a;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #f59e0b; 
      }
      .text-outline {
        -webkit-text-stroke: 1.5px black;
      }
      .text-outline-sm {
        -webkit-text-stroke: 1px black;
      }
      .text-outline-lg {
        -webkit-text-stroke: 2.5px black;
        text-shadow: 4px 4px 0px rgba(0,0,0,1);
      }
      .comic-border {
        border: 4px solid black;
      }
      /* Authentic Printed Comic Paper Aesthetic */
      .comic-paper-sheet {
        background-color: #ffffff;
        box-shadow: 12px 12px 0px 0px #000000, 0 20px 35px -10px rgba(0,0,0,0.65);
      }
      /* Comic Panel Clip Path for extra punch */
      .panel-skew {
        clip-path: polygon(2% 0%, 100% 1%, 98% 100%, 0% 98%);
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('PWA Service Worker registered:', reg.scope);
          }).catch((err) => {
            console.warn('PWA Service Worker registration non-fatal error:', err);
          });
        });
      }
    </script>
  </body>
</html>
