services:
  - type: web
    name: comicgen-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
